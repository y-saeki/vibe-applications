[package]
name = "eleven-zip"
version = "0.1.1"
edition = "2024"
publish = false
description = "Extracts archives from Explorer with a 7-Zip it keeps up to date"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[dev-dependencies]
# art.rs draws the icon from icon.svg; build.rs and the tests use it, the
# executable carries the result as a resource.
resvg = "0.48"

[build-dependencies]
resvg = "0.48"
windows-reactor-setup = "0.100"

[target.'cfg(windows)'.dependencies]
windows-reactor = "0.100"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
