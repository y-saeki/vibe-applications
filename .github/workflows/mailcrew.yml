name: mailcrew

on:
  push:
    # Branches other than main are verified through their pull request, so that
    # a single commit does not trigger two identical runs.
    branches:
      - main
    paths:
      - "mailcrew/**"
      - ".github/workflows/mailcrew.yml"
  pull_request:
    paths:
      - "mailcrew/**"
      - ".github/workflows/mailcrew.yml"

concurrency:
  group: mailcrew-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The core crate is checked on both platforms because what it leans on
  # differs on each: the credential store (Keychain / Credential Manager) and
  # the TLS stack (Security.framework / SChannel). Only the macOS app ships,
  # but the Windows side is kept compiling for the WinUI app that is to come.
  rust:
    name: rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mailcrew/core
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # Neither clippy nor the tests read a backtrace, and generating debug
      # info is expensive on Windows, where it means writing PDBs.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      # After the toolchain, whose version is part of the cache key.
      # Caches are evicted least-recently-used past 10 GB per repository, and
      # the ones a pull request wrote go away when it closes.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mailcrew/core
      # With and without the bindings the app calls the crate through.
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features ffi -- -D warnings
      - name: Tests
        run: cargo test --features ffi

  # The app: the core crate as a static library, the Swift sources UniFFI
  # writes from it, calls across into Rust, then the SwiftUI app's unit tests,
  # and the Release build the pull request comment and the release hand out.
  # Apple silicon only.
  app:
    name: app (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mailcrew
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Toolchains
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin
          swift --version
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mailcrew/core
      - name: Library and bindings
        working-directory: mailcrew/core/swift
        run: ./build.sh
      - name: Swift tests
        working-directory: mailcrew/core/swift
        run: swift test -Xlinker -L"$(./build.sh --lib-dir)"
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: App tests
        run: |
          xcodebuild test \
            -project MailCrew.xcodeproj \
            -scheme MailCrew \
            -destination 'platform=macOS,arch=arm64'
      - name: Release build
        run: |
          xcodebuild build \
            -project MailCrew.xcodeproj \
            -scheme MailCrew \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData
      # The disk image holds the app and a link to /Applications, so that it
      # can be dragged across. Named as the Tauri app's was, so that the
      # release's files keep their names.
      - name: Disk image
        run: |
          app="build/DerivedData/Build/Products/Release/Mail Crew.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")"
          codesign --verify --strict "${app}"
          staging="$(mktemp -d)"
          cp -R "${app}" "${staging}/"
          ln -s /Applications "${staging}/Applications"
          mkdir -p build/dmg
          hdiutil create \
            -volname "Mail Crew" \
            -srcfolder "${staging}" \
            -format UDZO \
            -ov \
            "build/dmg/Mail Crew_${version}_aarch64.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mailcrew-macos-latest
          if-no-files-found: error
          path: mailcrew/build/dmg/*.dmg

  # The pull request itself only shows a check mark, so point at the binaries
  # the run just uploaded instead of making the reader walk the Actions tab.
  notify:
    needs: app
    if: github.event_name == 'pull_request' && needs.app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The comment is what gets read before installing the build, so it is
      # where an unchanged version is worth saying out loud.
      # mailcrew-version.yml already fails the pull request over it; this is
      # the same fact where the person about to install is looking.
      - name: Work out what the build's version means
        run: |
          read_version() { awk '$1 == "MARKETING_VERSION:" { gsub(/"/, "", $2); print $2; exit }'; }
          version="$(read_version < mailcrew/project.yml)"
          git fetch --depth=1 origin "${BASE_REF}"
          if ! base="$(git show FETCH_HEAD:mailcrew/project.yml 2>/dev/null | read_version)" || [ -z "${base}" ]; then
            note="✅ 最初のリリースとして \`${version}\` が作られます。"
          elif [ "${version}" = "${base}" ]; then
            note="⚠️ バージョンは \`${version}\` のままです。**このままマージしても Release は作られません。**"
          else
            note="✅ バージョンは \`${base}\` から \`${version}\` に上がります。"
          fi
          {
            echo "VERSION_NOTE<<NOTE_EOF"
            echo "${note}"
            echo "NOTE_EOF"
          } >> "${GITHUB_ENV}"
      # Collected before the new comment is posted, so that it is not in the
      # list. The marker is the first line of every comment this job writes.
      - name: Collect the comments this job wrote before
        run: |
          gh api graphql \
            -f owner="${OWNER}" -f name="${REPO_NAME}" -F number="${PR_NUMBER}" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    comments(last: 100) {
                      nodes { id isMinimized body }
                    }
                  }
                }
              }' \
            --jq '
              .data.repository.pullRequest.comments.nodes[]
              | select(.isMinimized | not)
              | select(.body | startswith("<!-- mailcrew-build-artifacts -->"))
              | .id
            ' > "${RUNNER_TEMP}/previous-comments.txt"
      # A new comment every time: editing the previous one sends no
      # notification, so a rebuild would pass unnoticed.
      - name: Comment the download links
        run: |
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          if [ "$(jq '.artifacts | length' <<<"${artifacts}")" -eq 0 ]; then
            echo "::error::the run uploaded no artifacts"
            exit 1
          fi
          jq -r --arg run_url "${RUN_URL}" --arg sha "${HEAD_SHA}" --arg version_note "${VERSION_NOTE}" '
            def platform: {
              "mailcrew-macos-latest": "macOS (.dmg)"
            }[.] // .;
            def megabytes: . / 1048576 * 10 | round / 10;
            "<!-- mailcrew-build-artifacts -->",
            "## ビルド成果物",
            "",
            (.artifacts | sort_by(.name)[]
              | "- [ ] [\(.name | platform)](\($run_url)/artifacts/\(.id)) — \(.size_in_bytes | megabytes) MB"),
            "",
            "> [!TIP]",
            "> - ダウンロードには GitHub へのログインが必要です(保持期限: \(.artifacts[0].expires_at | fromdateiso8601 | strftime("%Y-%m-%d")))",
            "> - macOS では、アプリケーション実行前に隔離属性の削除を行ってください。",
            "> ```",
            "> xattr -dr com.apple.quarantine \"/Applications/Mail Crew.app\"",
            "> ```",
            "",
            "## ビルド情報",
            "",
            "- \($version_note)",
            "- \($sha[0:7]) を base ブランチにマージした状態のビルドです。",
            "- [run のサマリ](\($run_url))"
          ' <<<"${artifacts}" \
            | gh pr comment "${PR_NUMBER}" --body-file -
      # Collapsed as outdated rather than deleted: the older builds stay
      # downloadable until they expire. A failure here is not worth failing
      # the run over, since the comment above is already posted.
      - name: Hide the previous comments
        run: |
          while read -r id; do
            gh api graphql -f id="${id}" -f query='
              mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                  minimizedComment { isMinimized }
                }
              }' >/dev/null || echo "::warning::could not collapse the comment ${id}"
          done < "${RUNNER_TEMP}/previous-comments.txt"

  # Publishes the disk image built above whenever MARKETING_VERSION in
  # project.yml names a release that does not exist yet. Merging without a
  # version bump is therefore a no-op.
  release:
    needs: [app, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        run: |
          version="$(awk '$1 == "MARKETING_VERSION:" { gsub(/"/, "", $2); print $2; exit }' mailcrew/project.yml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read MARKETING_VERSION out of mailcrew/project.yml"
            exit 1
          fi
          tag="mailcrew-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists; skipping the release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.meta.outputs.exists == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mailcrew-*
          merge-multiple: true
          path: artifacts
      - if: steps.meta.outputs.exists == 'false'
        run: |
          # Collect by name rather than by path: how deeply upload-artifact
          # nests the files depends on the glob patterns it was given.
          mapfile -t assets < <(find artifacts -type f -name '*.dmg' | sort)
          if [ "${#assets[@]}" -ne 1 ]; then
            echo "::error::expected one .dmg, found ${#assets[@]}"
            find artifacts -type f
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## ダウンロード

          - macOS 14 以降(Apple Silicon): `.dmg`

          インストール手順は [README](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/mailcrew/README.md) を参照してください。
          NOTES
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Mail Crew ${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${assets[@]}"
