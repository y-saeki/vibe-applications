name: winwin

on:
  push:
    # Branches other than main are verified through their pull request, so that
    # a single commit does not trigger two identical runs.
    branches:
      - main
    paths:
      - "winwin/**"
      - ".github/workflows/winwin.yml"
  pull_request:
    paths:
      - "winwin/**"
      - ".github/workflows/winwin.yml"

concurrency:
  group: winwin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # winwin ships for Windows only, so one runner checks, tests and builds it.
  # The platform-independent modules (config, layout, shortcuts) would also
  # test on Linux, but the Win32 half only compiles here.
  build:
    name: build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: winwin
    env:
      # Neither clippy nor the tests read a backtrace, and generating debug
      # info is expensive on Windows, where it means writing PDBs.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      # After the toolchain, whose version is part of the cache key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: winwin
      - name: Rust lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      # NSIS comes with the runner image; installing it is the fallback for an
      # image that stops shipping it.
      - name: Installer
        shell: pwsh
        working-directory: winwin/installer
        run: |
          $version = (Select-String -Path ../Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis -and (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          # winwin.exe and the Windows App Runtime files build.rs staged beside it.
          ./payload.ps1 -Dir ..\target\release -Out payload.nsh
          & $makensis /V2 /INPUTCHARSET UTF8 "/DVERSION=$version" /DPAYLOAD=payload.nsh "/DOUTFILE=..\target\release\winwin_${version}_x64-setup.exe" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winwin-setup
          if-no-files-found: error
          path: winwin/target/release/winwin_*_x64-setup.exe

  # The pull request itself only shows a check mark, so point at the installer
  # the run just uploaded instead of making the reader walk the Actions tab.
  notify:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # winwin-version.yml already fails the pull request over an unchanged
      # version; this is the same fact where the person about to try the
      # build is looking. A base branch without winwin reads as a first
      # release.
      - name: Work out what the build's version means
        run: |
          read_version() {
            awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"");sub(/^version=/,"");print;exit}'
          }
          version="$(read_version < winwin/Cargo.toml)"
          git fetch --depth=1 origin "${BASE_REF}"
          base="$(git show FETCH_HEAD:winwin/Cargo.toml 2>/dev/null | read_version || true)"
          if [ -z "${base}" ]; then
            note="✅ 初回のリリースです(\`${version}\`)。"
          elif [ "${version}" = "${base}" ]; then
            note="⚠️ バージョンは \`${version}\` のままです。**このままマージしても Release は作られません。**"
          else
            note="✅ バージョンは \`${base}\` から \`${version}\` に上がります。"
          fi
          {
            echo "VERSION_NOTE<<NOTE_EOF"
            echo "${note}"
            echo "NOTE_EOF"
          } >> "${GITHUB_ENV}"
      # Collected before the new comment is posted, so that it is not in the
      # list. The marker is the first line of every comment this job writes.
      - name: Collect the comments this job wrote before
        run: |
          gh api graphql \
            -f owner="${OWNER}" -f name="${REPO_NAME}" -F number="${PR_NUMBER}" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    comments(last: 100) {
                      nodes { id isMinimized body }
                    }
                  }
                }
              }' \
            --jq '
              .data.repository.pullRequest.comments.nodes[]
              | select(.isMinimized | not)
              | select(.body | startswith("<!-- winwin-build-artifacts -->"))
              | .id
            ' > "${RUNNER_TEMP}/previous-comments.txt"
      # A new comment every time: editing the previous one sends no
      # notification, so a rebuild would pass unnoticed.
      - name: Comment the download link
        run: |
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          if [ "$(jq '.artifacts | length' <<<"${artifacts}")" -eq 0 ]; then
            echo "::error::the run uploaded no artifacts"
            exit 1
          fi
          jq -r --arg run_url "${RUN_URL}" --arg sha "${HEAD_SHA}" --arg version_note "${VERSION_NOTE}" '
            def megabytes: . / 1048576 * 100 | round / 100;
            "<!-- winwin-build-artifacts -->",
            "## ビルド成果物",
            "",
            (.artifacts[] | "- [ ] [Windows (-setup.exe)](\($run_url)/artifacts/\(.id)) — \(.size_in_bytes | megabytes) MB"),
            "",
            "> [!TIP]",
            "> - ダウンロードには GitHub へのログインが必要です(保持期限: \(.artifacts[0].expires_at | fromdateiso8601 | strftime("%Y-%m-%d")))",
            "> - インストーラは起動中の winwin を終了させてから上書きします。",
            "",
            "## ビルド情報",
            "",
            "- \($version_note)",
            "- \($sha[0:7]) を base ブランチにマージした状態のビルドです。",
            "- [run のサマリ](\($run_url))"
          ' <<<"${artifacts}" \
            | gh pr comment "${PR_NUMBER}" --body-file -
      # Collapsed as outdated rather than deleted: the older builds stay
      # downloadable until they expire. A failure here is not worth failing
      # the run over, since the comment above is already posted.
      - name: Hide the previous comments
        run: |
          while read -r id; do
            gh api graphql -f id="${id}" -f query='
              mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                  minimizedComment { isMinimized }
                }
              }' >/dev/null || echo "::warning::could not collapse the comment ${id}"
          done < "${RUNNER_TEMP}/previous-comments.txt"

  # Publishes the installer built above whenever the version in Cargo.toml names
  # a release that does not exist yet. Merging without a version bump is
  # therefore a no-op.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        run: |
          version="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"");sub(/^version=/,"");print;exit}' winwin/Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read a version out of winwin/Cargo.toml"
            exit 1
          fi
          tag="winwin-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists; skipping the release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.meta.outputs.exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: winwin-setup
          path: artifacts
      - if: steps.meta.outputs.exists == 'false'
        run: |
          setup="artifacts/winwin_${{ steps.meta.outputs.version }}_x64-setup.exe"
          if [ ! -f "${setup}" ]; then
            echo "::error::the build uploaded no ${setup#artifacts/}"
            find artifacts -type f
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## ダウンロード

          - Windows 10 / 11 (x64): `-setup.exe`

          インストール手順は [README](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/winwin/README.md) を参照してください。
          NOTES
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "winwin ${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${setup}"
