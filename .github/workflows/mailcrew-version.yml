name: mailcrew version

# Raising the version is a manual step, and forgetting it fails quietly: the
# release job skips a tag that already exists, so the change never reaches
# anyone and nothing says so. This check turns that into a red pull request.
#
# It is a workflow of its own because it listens for label changes, and adding
# those to mailcrew.yml would re-run the app's build and tests every time a
# label moves.
#
# There is deliberately no paths filter. A check that is skipped never reports,
# and a required check that never reports blocks the pull request for good, so
# the job runs everywhere and decides for itself whether it has anything to say.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: mailcrew-version-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
      # A pull request that is not meant to ship carries this label instead of
      # a bump, so that skipping the release is a decision rather than an
      # oversight.
      NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
    steps:
      - name: Find out whether this pull request touches mailcrew
        id: scope
        run: |
          files="$(gh pr diff --name-only "${PR_NUMBER}")"
          if printf '%s\n' "${files}" | grep -q '^mailcrew/'; then
            echo "touched=true" >> "${GITHUB_OUTPUT}"
          else
            echo "touched=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::no file under mailcrew/ changed, so there is nothing to release."
          fi
      - if: steps.scope.outputs.touched == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the version
        if: steps.scope.outputs.touched == 'true'
        run: |
          version="$(awk '$1 == "MARKETING_VERSION:" { gsub(/"/, "", $2); print $2; exit }' mailcrew/project.yml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read MARKETING_VERSION out of mailcrew/project.yml"
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
      # Against the tip of the base branch rather than the sha the pull request
      # started from: a version another pull request has already merged is just
      # as unreleasable as an unchanged one. The checkout above is the merge
      # ref, so a branch that simply predates someone else's release reads as
      # unchanged here rather than as a downgrade.
      - name: Check that the version is ahead of the base branch
        if: steps.scope.outputs.touched == 'true'
        run: |
          git fetch --depth=1 origin "${BASE_REF}"
          base="$(git show FETCH_HEAD:mailcrew/project.yml 2>/dev/null | awk '$1 == "MARKETING_VERSION:" { gsub(/"/, "", $2); print $2; exit }')"
          if [ -z "${base}" ]; then
            echo "::error::could not read MARKETING_VERSION out of mailcrew/project.yml on ${BASE_REF}"
            exit 1
          fi
          if [ "${VERSION}" = "${base}" ]; then
            if [ "${NO_RELEASE}" = "true" ]; then
              echo "::notice::mailcrew stays at ${VERSION}; the no-release label says that is deliberate."
              exit 0
            fi
            echo "::error::mailcrew is still ${VERSION}, the same as ${BASE_REF}, so merging this would publish nothing. Raise MARKETING_VERSION in mailcrew/project.yml, or label this pull request no-release."
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "${base}" "${VERSION}" | sort -V | tail -1)"
          if [ "${newest}" != "${VERSION}" ]; then
            echo "::error::mailcrew is ${VERSION} here but already ${base} on ${BASE_REF}."
            exit 1
          fi
          echo "::notice::mailcrew goes from ${base} to ${VERSION}."
