name: meta-gesture

on:
  push:
    # Branches other than main are verified through their pull request, so that
    # a single commit does not trigger two identical runs.
    branches:
      - main
    paths:
      - "meta-gesture/**"
      - ".github/workflows/meta-gesture.yml"
  pull_request:
    paths:
      - "meta-gesture/**"
      - ".github/workflows/meta-gesture.yml"

concurrency:
  group: meta-gesture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Windows application: checked, tested and built here. The library
  # alone would also test elsewhere, but the Win32 half only compiles here.
  build:
    name: build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meta-gesture
    env:
      # Neither clippy nor the tests read a backtrace, and generating debug
      # info is expensive on Windows, where it means writing PDBs.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      # After the toolchain, whose version is part of the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: meta-gesture
      - name: Rust lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      # NSIS comes with the runner image; installing it is the fallback for an
      # image that stops shipping it.
      - name: Installer
        shell: pwsh
        working-directory: meta-gesture/installer
        run: |
          $version = (Select-String -Path ../Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis -and (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          # meta-gesture.exe and the Windows App Runtime files build.rs staged beside it.
          ./payload.ps1 -Dir ..\target\release -Out payload.nsh
          & $makensis /V2 /INPUTCHARSET UTF8 "/DVERSION=$version" /DPAYLOAD=payload.nsh "/DOUTFILE=..\target\release\meta-gesture_${version}_x64-setup.exe" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meta-gesture-setup
          if-no-files-found: error
          path: meta-gesture/target/release/meta-gesture_*_x64-setup.exe

  # The macOS app: the library's tests with the ffi feature, which only the
  # Mac builds, then the app and the disk image it ships in. The app is for
  # Apple silicon only (see the root CLAUDE.md), as the runner is.
  build-macos:
    name: build (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meta-gesture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: meta-gesture
      - name: Rust lint
        run: cargo clippy --all-targets --locked --features ffi-bindgen -- -D warnings
      - name: Rust tests
        run: cargo test --locked --features ffi
      # The certificate that keeps the accessibility permission across
      # updates (DEVELOPMENT.md, "macOS 版の署名"). Pull requests from forks
      # and Dependabot get no secrets and build ad hoc; a push to main must
      # not, or the release would cost every user their permission.
      - name: Signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.META_GESTURE_MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.META_GESTURE_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${CERTIFICATE_P12}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = push ]; then
              echo "::error::META_GESTURE_MACOS_CERTIFICATE_P12 is not set; a release must not be signed ad hoc"
              exit 1
            fi
            echo "::notice::no signing certificate; the app is signed ad hoc"
            exit 0
          fi
          keychain="${RUNNER_TEMP}/meta-gesture-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          p12="${RUNNER_TEMP}/meta-gesture-signing.p12"
          printf '%s' "${CERTIFICATE_P12}" | base64 --decode > "${p12}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${p12}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          rm -f "${p12}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}"
          # Without -v: a self-signed certificate is not trusted, which
          # codesign accepts but find-identity -v would filter out.
          identity="$(security find-identity -p codesigning "${keychain}" | awk '/^ *1\)/{print $2; exit}')"
          if [ -z "${identity}" ]; then
            echo "::error::the certificate holds no identity for code signing"
            security find-identity -p codesigning "${keychain}"
            exit 1
          fi
          echo "META_GESTURE_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
      - name: App
        run: macos/build.sh
      # A certificate's signature names the bundle and the certificate, and
      # stays the same from one build to the next; an ad hoc one names the
      # build itself (cdhash).
      - name: Signature
        run: |
          codesign --verify --strict macos/meta-gesture.app
          requirement="$(codesign -d -r- macos/meta-gesture.app 2>&1 | sed -n 's/^#* *designated => //p')"
          echo "designated requirement: ${requirement}"
          if [ -n "${META_GESTURE_SIGN_IDENTITY:-}" ]; then
            case "${requirement}" in
              *'certificate leaf'*) ;;
              *)
                echo "::error::the app is not signed with the certificate"
                exit 1
                ;;
            esac
          fi
          echo "- 署名の要件: \`${requirement}\`" >> "${GITHUB_STEP_SUMMARY}"
      # The app beside a link to /Applications, to be dragged onto it.
      - name: Disk image
        run: |
          version="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"");sub(/^version=/,"");print;exit}' Cargo.toml)"
          staging="${RUNNER_TEMP}/dmg"
          mkdir -p "${staging}"
          ditto macos/meta-gesture.app "${staging}/meta-gesture.app"
          ln -s /Applications "${staging}/Applications"
          hdiutil create -volname meta-gesture -srcfolder "${staging}" -format UDZO -ov "macos/meta-gesture_${version}_macos-arm64.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meta-gesture-macos
          if-no-files-found: error
          path: meta-gesture/macos/meta-gesture_*_macos-arm64.dmg
      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="${RUNNER_TEMP}/meta-gesture-signing.keychain-db"
          if [ -f "${keychain}" ]; then
            security delete-keychain "${keychain}"
          fi

  # The pull request itself only shows a check mark, so point at the installer
  # the run just uploaded instead of making the reader walk the Actions tab.
  # The macOS build is listed when it succeeded, and does not hold back the
  # Windows one when it did not.
  notify:
    needs: [build, build-macos]
    if: always() && github.event_name == 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # meta-gesture-version.yml already fails the pull request over an unchanged
      # version; this is the same fact where the person about to try the
      # build is looking. A base branch without meta-gesture reads as a first
      # release.
      - name: Work out what the build's version means
        run: |
          read_version() {
            awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"");sub(/^version=/,"");print;exit}'
          }
          version="$(read_version < meta-gesture/Cargo.toml)"
          git fetch --depth=1 origin "${BASE_REF}"
          base="$(git show FETCH_HEAD:meta-gesture/Cargo.toml 2>/dev/null | read_version || true)"
          if [ -z "${base}" ]; then
            note="✅ 初回のリリースです(\`${version}\`)。"
          elif [ "${version}" = "${base}" ]; then
            note="⚠️ バージョンは \`${version}\` のままです。**このままマージしても Release は作られません。**"
          else
            note="✅ バージョンは \`${base}\` から \`${version}\` に上がります。"
          fi
          {
            echo "VERSION_NOTE<<NOTE_EOF"
            echo "${note}"
            echo "NOTE_EOF"
          } >> "${GITHUB_ENV}"
      # Collected before the new comment is posted, so that it is not in the
      # list. The marker is the first line of every comment this job writes.
      - name: Collect the comments this job wrote before
        run: |
          gh api graphql \
            -f owner="${OWNER}" -f name="${REPO_NAME}" -F number="${PR_NUMBER}" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    comments(last: 100) {
                      nodes { id isMinimized body }
                    }
                  }
                }
              }' \
            --jq '
              .data.repository.pullRequest.comments.nodes[]
              | select(.isMinimized | not)
              | select(.body | startswith("<!-- meta-gesture-build-artifacts -->"))
              | .id
            ' > "${RUNNER_TEMP}/previous-comments.txt"
      # A new comment every time: editing the previous one sends no
      # notification, so a rebuild would pass unnoticed.
      - name: Comment the download link
        run: |
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          if [ "$(jq '.artifacts | length' <<<"${artifacts}")" -eq 0 ]; then
            echo "::error::the run uploaded no artifacts"
            exit 1
          fi
          jq -r --arg run_url "${RUN_URL}" --arg sha "${HEAD_SHA}" --arg version_note "${VERSION_NOTE}" '
            def platform: {
              "meta-gesture-setup": "Windows (.exe)",
              "meta-gesture-macos": "macOS (.dmg)"
            }[.] // .;
            # The install order the comment asks for: Windows needs nothing
            # beyond the installer, macOS needs the quarantine attribute gone.
            def platform_rank: {
              "meta-gesture-setup": 0,
              "meta-gesture-macos": 1
            }[.] // 2;
            def megabytes: . / 1048576 * 10 | round / 10;
            "<!-- meta-gesture-build-artifacts -->",
            "## ビルド成果物",
            "",
            (.artifacts | sort_by([(.name | platform_rank), .name])[]
              | "- [ ] [\(.name | platform)](\($run_url)/artifacts/\(.id)) — \(.size_in_bytes | megabytes) MB"),
            "",
            "> [!TIP]",
            "> - ダウンロードには GitHub へのログインが必要です(保持期限: \(.artifacts[0].expires_at | fromdateiso8601 | strftime("%Y-%m-%d")))",
            "> - Windows のインストーラは起動中の meta-gesture を終了させてから上書きします。",
            "> - macOS では、アプリケーション実行前に隔離属性の削除を行ってください。",
            "> ```",
            "> xattr -dr com.apple.quarantine /Applications/meta-gesture.app",
            "> ```",
            "",
            "## ビルド情報",
            "",
            "- \($version_note)",
            "- \($sha[0:7]) を base ブランチにマージした状態のビルドです。",
            "- [run のサマリ](\($run_url))"
          ' <<<"${artifacts}" \
            | gh pr comment "${PR_NUMBER}" --body-file -
      # Collapsed as outdated rather than deleted: the older builds stay
      # downloadable until they expire. A failure here is not worth failing
      # the run over, since the comment above is already posted.
      - name: Hide the previous comments
        run: |
          while read -r id; do
            gh api graphql -f id="${id}" -f query='
              mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                  minimizedComment { isMinimized }
                }
              }' >/dev/null || echo "::warning::could not collapse the comment ${id}"
          done < "${RUNNER_TEMP}/previous-comments.txt"

  # Publishes the installer and the disk image built above whenever the
  # version in Cargo.toml names a release that does not exist yet. Merging
  # without a version bump is therefore a no-op.
  release:
    needs: [build, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        run: |
          version="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"");sub(/^version=/,"");print;exit}' meta-gesture/Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read a version out of meta-gesture/Cargo.toml"
            exit 1
          fi
          tag="meta-gesture-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists; skipping the release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.meta.outputs.exists == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: meta-gesture-setup
          path: artifacts
      - if: steps.meta.outputs.exists == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: meta-gesture-macos
          path: artifacts
      - if: steps.meta.outputs.exists == 'false'
        run: |
          setup="artifacts/meta-gesture_${{ steps.meta.outputs.version }}_x64-setup.exe"
          dmg="artifacts/meta-gesture_${{ steps.meta.outputs.version }}_macos-arm64.dmg"
          for file in "${setup}" "${dmg}"; do
            if [ ! -f "${file}" ]; then
              echo "::error::the build uploaded no ${file#artifacts/}"
              find artifacts -type f
              exit 1
            fi
          done
          cat > notes.md <<'NOTES'
          ## ダウンロード

          - Windows 10 / 11 (x64): `-setup.exe`
          - macOS 13 以降 (Apple シリコン): `.dmg`

          インストール手順は [README](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/meta-gesture/README.md) を参照してください。
          NOTES
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "meta-gesture ${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${setup}" "${dmg}"
