name: diffpad

on:
  push:
    # Branches other than main are verified through their pull request, so that
    # a single commit does not trigger two identical runs.
    branches:
      - main
    paths:
      - "diffpad/**"
      - ".github/workflows/diffpad.yml"
  pull_request:
    paths:
      - "diffpad/**"
      - ".github/workflows/diffpad.yml"

concurrency:
  group: diffpad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The frontend is the same code in both webviews, so its end-to-end tests run
  # once on Linux against Chromium (WebView2's engine) and WebKit
  # (WKWebView's), with the Rust side faked. See diffpad/tests/e2e/.
  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: diffpad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm ships a self-contained binary and installs Node.js itself, so
      # one step covers both. It needs pnpm 11 or newer.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12
          runtime: node@22
          cache: true
          cache-dependency-path: diffpad/pnpm-lock.yaml
          # `pnpm install --frozen-lockfile` is a step of its own below.
          install: false
      - run: pnpm install --frozen-lockfile
      # TypeScript sees the same sources on every platform, so the Windows and
      # macOS runners do not need to repeat this.
      - run: pnpm typecheck
      # Whether the chrome is still built out of its tokens. Static and
      # instant, so it sits here rather than in the browser suite.
      - run: pnpm lint:style
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: diffpad/playwright-report
          retention-days: 7

  # The Rust side is checked on both platforms because the crate compiles
  # different modules on each (the jump list and the WebView2 settings on
  # Windows, font enumeration on both). This runs beside `build` rather than
  # ahead of it: the two compile the same dependencies in different profiles,
  # so chaining them would only make the run as long as their sum.
  rust:
    name: rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: diffpad
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # Neither clippy nor the tests read a backtrace, and generating debug
      # info is expensive on Windows, where it means writing PDBs.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm ships a self-contained binary and installs Node.js itself, so
      # one step covers both. It needs pnpm 11 or newer.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12
          runtime: node@22
          cache: true
          cache-dependency-path: diffpad/pnpm-lock.yaml
          # `pnpm install --frozen-lockfile` is a step of its own below.
          install: false
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      # After the toolchain, whose version is part of the cache key.
      # Every push writes a cache, pull requests included. Splitting the jobs
      # moved the dependency download onto `tauri build`, which a cache main
      # alone writes cannot take back: a pull request only reads that one on
      # its first push, and it is the later ones that pay for a rebuild.
      # Caches are evicted least-recently-used past 10 GB per repository, and
      # the ones a pull request wrote go away when it closes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: diffpad/src-tauri
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!` verifies that frontendDist (dist/) exists.
      - run: pnpm build
      - name: Rust lint
        working-directory: diffpad/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: diffpad/src-tauri
        run: cargo test

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: diffpad
    strategy:
      fail-fast: false
      matrix:
        # One glob per runner: given several path patterns, upload-artifact
        # roots the archive at their least common ancestor, which would bury
        # each binary under a dmg/ or nsis/ directory inside the zip.
        include:
          - os: macos-latest
            bundle: dmg/*.dmg
          - os: windows-latest
            bundle: nsis/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm ships a self-contained binary and installs Node.js itself, so
      # one step covers both. It needs pnpm 11 or newer.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 12
          runtime: node@22
          cache: true
          cache-dependency-path: diffpad/pnpm-lock.yaml
          # `pnpm install --frozen-lockfile` is a step of its own below.
          install: false
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: diffpad/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tauri build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diffpad-${{ matrix.os }}
          if-no-files-found: error
          path: diffpad/src-tauri/target/release/bundle/${{ matrix.bundle }}

  # The pull request itself only shows a check mark, so point at the binaries
  # the run just uploaded instead of making the reader walk the Actions tab.
  notify:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The comment is what gets read before installing the build, on either
      # platform, so it is where an unchanged version is worth saying out loud.
      # diffpad-version.yml already fails the pull request over it; this is
      # the same fact where the person about to install is looking.
      - name: Work out what the build's version means
        run: |
          version="$(jq -re .version diffpad/src-tauri/tauri.conf.json)"
          git fetch --depth=1 origin "${BASE_REF}"
          # A base branch without diffpad/ is the pull request that adds it;
          # jq exits non-zero on the empty input git show leaves behind.
          if ! base="$(git show FETCH_HEAD:diffpad/src-tauri/tauri.conf.json 2>/dev/null | jq -re .version)"; then
            note="✅ diffpad は新規のアプリケーションです。マージすると \`${version}\` が最初の Release になります。"
          elif [ "${version}" = "${base}" ]; then
            note="⚠️ バージョンは \`${version}\` のままです。**このままマージしても Release は作られません。**"
          else
            note="✅ バージョンは \`${base}\` から \`${version}\` に上がります。"
          fi
          {
            echo "VERSION_NOTE<<NOTE_EOF"
            echo "${note}"
            echo "NOTE_EOF"
          } >> "${GITHUB_ENV}"
      # Collected before the new comment is posted, so that it is not in the
      # list. The marker is the first line of every comment this job writes.
      - name: Collect the comments this job wrote before
        run: |
          gh api graphql \
            -f owner="${OWNER}" -f name="${REPO_NAME}" -F number="${PR_NUMBER}" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    comments(last: 100) {
                      nodes { id isMinimized body }
                    }
                  }
                }
              }' \
            --jq '
              .data.repository.pullRequest.comments.nodes[]
              | select(.isMinimized | not)
              | select(.body | startswith("<!-- diffpad-build-artifacts -->"))
              | .id
            ' > "${RUNNER_TEMP}/previous-comments.txt"
      # A new comment every time: editing the previous one sends no
      # notification, so a rebuild would pass unnoticed.
      - name: Comment the download links
        run: |
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          if [ "$(jq '.artifacts | length' <<<"${artifacts}")" -eq 0 ]; then
            echo "::error::the run uploaded no artifacts"
            exit 1
          fi
          jq -r --arg run_url "${RUN_URL}" --arg sha "${HEAD_SHA}" --arg version_note "${VERSION_NOTE}" '
            def platform: {
              "diffpad-windows-latest": "Windows (.exe)",
              "diffpad-macos-latest": "macOS (.dmg)"
            }[.] // .;
            # The install order the comment asks for: Windows needs nothing
            # beyond the installer, macOS needs the quarantine attribute gone.
            def platform_rank: {
              "diffpad-windows-latest": 0,
              "diffpad-macos-latest": 1
            }[.] // 2;
            def megabytes: . / 1048576 * 10 | round / 10;
            "<!-- diffpad-build-artifacts -->",
            "## ビルド成果物",
            "",
            (.artifacts | sort_by([(.name | platform_rank), .name])[]
              | "- [ ] [\(.name | platform)](\($run_url)/artifacts/\(.id)) — \(.size_in_bytes | megabytes) MB"),
            "",
            "> [!TIP]",
            "> - ダウンロードには GitHub へのログインが必要です(保持期限: \(.artifacts[0].expires_at | fromdateiso8601 | strftime("%Y-%m-%d")))",
            "> - macOS では、アプリケーション実行前に隔離属性の削除を行ってください。",
            "> ```",
            "> xattr -dr com.apple.quarantine /Applications/diffpad.app",
            "> ```",
            "",
            "## ビルド情報",
            "",
            "- \($version_note)",
            "- \($sha[0:7]) を base ブランチにマージした状態のビルドです。",
            "- [run のサマリ](\($run_url))"
          ' <<<"${artifacts}" \
            | gh pr comment "${PR_NUMBER}" --body-file -
      # Collapsed as outdated rather than deleted: the older builds stay
      # downloadable until they expire. A failure here is not worth failing
      # the run over, since the comment above is already posted.
      - name: Hide the previous comments
        run: |
          while read -r id; do
            gh api graphql -f id="${id}" -f query='
              mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                  minimizedComment { isMinimized }
                }
              }' >/dev/null || echo "::warning::could not collapse the comment ${id}"
          done < "${RUNNER_TEMP}/previous-comments.txt"

  # Publishes the binaries built above whenever the version in tauri.conf.json
  # names a release that does not exist yet. Merging without a version bump is
  # therefore a no-op.
  release:
    needs: [build, frontend, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        run: |
          version="$(jq -re .version diffpad/src-tauri/tauri.conf.json)"
          tag="diffpad-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists; skipping the release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.meta.outputs.exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: diffpad-*
          merge-multiple: true
          path: artifacts
      - if: steps.meta.outputs.exists == 'false'
        run: |
          # Collect by name rather than by path: how deeply upload-artifact
          # nests the files depends on the glob patterns it was given.
          mapfile -t assets < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) | sort)
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "::error::expected one .dmg and one .exe, found ${#assets[@]}"
            find artifacts -type f
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## ダウンロード

          - macOS 11 以降(Apple Silicon): `.dmg`
          - Windows 10 (1809) / 11 (x64): `-setup.exe`

          インストール手順は [README](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/diffpad/README.md) を参照してください。
          NOTES
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "diffpad ${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${assets[@]}"
