name: draftpad

on:
  push:
    # Branches other than main are verified through their pull request, so that
    # a single commit does not trigger two identical runs.
    branches:
      - main
    paths:
      - "draftpad/**"
      - ".github/workflows/draftpad.yml"
  pull_request:
    paths:
      - "draftpad/**"
      - ".github/workflows/draftpad.yml"

concurrency:
  group: draftpad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The frontend is the same code in both webviews, so its end-to-end tests run
  # once on Linux against Chromium (WebView2's engine) and WebKit
  # (WKWebView's), with the Rust side faked. See draftpad/tests/e2e/.
  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: draftpad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: draftpad/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: draftpad/playwright-report
          retention-days: 7

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: draftpad
    strategy:
      fail-fast: false
      matrix:
        # One glob per runner: given several path patterns, upload-artifact
        # roots the archive at their least common ancestor, which would bury
        # each binary under a dmg/ or nsis/ directory inside the zip.
        include:
          - os: macos-latest
            bundle: dmg/*.dmg
          - os: windows-latest
            bundle: nsis/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: draftpad/pnpm-lock.yaml
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # `tauri::generate_context!` verifies that frontendDist (dist/) exists.
      - run: pnpm build
      - name: Rust lint
        working-directory: draftpad/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: draftpad/src-tauri
        run: cargo test
      - run: pnpm tauri build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: draftpad-${{ matrix.os }}
          if-no-files-found: error
          path: draftpad/src-tauri/target/release/bundle/${{ matrix.bundle }}

  # The pull request itself only shows a check mark, so point at the binaries
  # the run just uploaded instead of making the reader walk the Actions tab.
  notify:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Resolves the pull request without a checkout.
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment the download links
        run: |
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          if [ "$(jq '.artifacts | length' <<<"${artifacts}")" -eq 0 ]; then
            echo "::error::the run uploaded no artifacts"
            exit 1
          fi
          # `--edit-last --create-if-none` keeps a single comment per pull
          # request: the first push creates it, later ones rewrite it.
          jq -r --arg run_url "${RUN_URL}" --arg sha "${HEAD_SHA}" '
            def platform: {
              "draftpad-macos-latest": "macOS (.dmg)",
              "draftpad-windows-latest": "Windows (.exe)"
            }[.] // .;
            def megabytes: . / 1048576 * 10 | round / 10;
            "## ビルド成果物",
            "",
            (.artifacts | sort_by(.name)[]
              | "- [\(.name | platform)](\($run_url)/artifacts/\(.id)) — \(.size_in_bytes | megabytes) MB"),
            "",
            "\($sha[0:7]) を base ブランチにマージした状態のビルドです。ダウンロードには GitHub へのログインが必要です。",
            "",
            "- [run のサマリ](\($run_url))",
            "- 保持期限: \(.artifacts[0].expires_at | fromdateiso8601 | strftime("%Y-%m-%d"))"
          ' <<<"${artifacts}" \
            | gh pr comment "${PR_NUMBER}" --edit-last --create-if-none --body-file -

  # Publishes the binaries built above whenever the version in tauri.conf.json
  # names a release that does not exist yet. Merging without a version bump is
  # therefore a no-op.
  release:
    needs: [build, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        run: |
          version="$(jq -re .version draftpad/src-tauri/tauri.conf.json)"
          tag="draftpad-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists; skipping the release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.meta.outputs.exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: draftpad-*
          merge-multiple: true
          path: artifacts
      - if: steps.meta.outputs.exists == 'false'
        run: |
          # Collect by name rather than by path: how deeply upload-artifact
          # nests the files depends on the glob patterns it was given.
          mapfile -t assets < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) | sort)
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "::error::expected one .dmg and one .exe, found ${#assets[@]}"
            find artifacts -type f
            exit 1
          fi
          cat > notes.md <<'NOTES'
          ## ダウンロード

          - macOS 11 以降(Apple Silicon): `.dmg`
          - Windows 10 (1809) / 11 (x64): `-setup.exe`

          インストール手順は [README](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/draftpad/README.md) を参照してください。
          NOTES
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "draftpad ${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            "${assets[@]}"
