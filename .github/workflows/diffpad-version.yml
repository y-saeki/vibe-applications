name: diffpad version

# Raising the version is a manual step, and forgetting it fails quietly: the
# release job skips a tag that already exists, so the change never reaches
# anyone and nothing says so. This check turns that into a red pull request.
#
# It is a workflow of its own because it listens for label changes, and adding
# those to diffpad.yml would re-run the macOS and Windows builds every time a
# label moves.
#
# There is deliberately no paths filter. A check that is skipped never reports,
# and a required check that never reports blocks the pull request for good, so
# the job runs everywhere and decides for itself whether it has anything to say.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: diffpad-version-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
      # A pull request that is not meant to ship carries this label instead of
      # a bump, so that skipping the release is a decision rather than an
      # oversight.
      NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
    steps:
      - name: Find out whether this pull request touches diffpad
        id: scope
        run: |
          files="$(gh pr diff --name-only "${PR_NUMBER}")"
          if printf '%s\n' "${files}" | grep -q '^diffpad/'; then
            echo "touched=true" >> "${GITHUB_OUTPUT}"
          else
            echo "touched=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::no file under diffpad/ changed, so there is nothing to release."
          fi
      - if: steps.scope.outputs.touched == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # tauri.conf.json is the one that decides the release, but a mismatch in
      # the other three is confusing enough to be worth catching here.
      - name: Check that the four version fields agree
        if: steps.scope.outputs.touched == 'true'
        run: |
          cd diffpad
          conf="$(jq -re .version src-tauri/tauri.conf.json)"
          pkg="$(jq -re .version package.json)"
          toml="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"");sub(/^version=/,"");print;exit}' src-tauri/Cargo.toml)"
          lock="$(awk '/^name = "diffpad"$/{getline;gsub(/[" ]/,"");sub(/^version=/,"");print;exit}' src-tauri/Cargo.lock)"
          for pair in "package.json:${pkg}" "src-tauri/Cargo.toml:${toml}" "src-tauri/Cargo.lock:${lock}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "${value}" ]; then
              echo "::error::could not read a version out of diffpad/${name}"
              exit 1
            fi
            if [ "${value}" != "${conf}" ]; then
              echo "::error::diffpad/${name} says ${value}, but diffpad/src-tauri/tauri.conf.json says ${conf}. Cargo.lock follows Cargo.toml through \`cargo update -p diffpad\`."
              exit 1
            fi
          done
          echo "VERSION=${conf}" >> "${GITHUB_ENV}"
      # Against the tip of the base branch rather than the sha the pull request
      # started from: a version another pull request has already merged is just
      # as unreleasable as an unchanged one. The checkout above is the merge
      # ref, so a branch that simply predates someone else's release reads as
      # unchanged here rather than as a downgrade.
      - name: Check that the version is ahead of the base branch
        if: steps.scope.outputs.touched == 'true'
        run: |
          git fetch --depth=1 origin "${BASE_REF}"
          # A base branch without diffpad/ at all is the pull request that
          # adds it: there is nothing to be ahead of, and jq reports the
          # missing file by exiting non-zero on the empty input.
          if ! base="$(git show FETCH_HEAD:diffpad/src-tauri/tauri.conf.json 2>/dev/null | jq -re .version)"; then
            echo "::notice::${BASE_REF} has no diffpad/ yet, so ${VERSION} is its first release."
            exit 0
          fi
          if [ "${VERSION}" = "${base}" ]; then
            if [ "${NO_RELEASE}" = "true" ]; then
              echo "::notice::diffpad stays at ${VERSION}; the no-release label says that is deliberate."
              exit 0
            fi
            echo "::error::diffpad is still ${VERSION}, the same as ${BASE_REF}, so merging this would publish nothing. Raise the version in diffpad/src-tauri/tauri.conf.json and the three files that mirror it, or label this pull request no-release."
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "${base}" "${VERSION}" | sort -V | tail -1)"
          if [ "${newest}" != "${VERSION}" ]; then
            echo "::error::diffpad is ${VERSION} here but already ${base} on ${BASE_REF}."
            exit 1
          fi
          echo "::notice::diffpad goes from ${base} to ${VERSION}."
