# Dependabot watches every manifest in the repository. Each entry names one
# application directory, so that a pull request never spans two applications.
# Its pull requests carry no-release: a dependency update ships with the next
# release of the application rather than as one of its own, and
# .github/workflows/dependabot-merge.yml merges it once every check has passed.
#
# Adding or removing a dependency, a manifest or an application changes this
# file in the same commit (see CLAUDE.md).
#
# Every entry waits 7 days after a release before proposing it, the same as
# draftpad's pnpm-workspace.yaml (minimumReleaseAge), which refuses anything
# younger. One wait for all also keeps Tauri's crates and npm packages, which
# are released together, arriving in the same week.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /eleven-zip
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - no-release
    commit-message:
      prefix: eleven-zip
    groups:
      # windows-reactor-setup lays out the Windows App Runtime that
      # windows-reactor loads, so the two move together.
      windows-reactor:
        patterns:
          - windows-reactor
          - windows-reactor-setup
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /winwin
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - no-release
    commit-message:
      prefix: winwin
    groups:
      windows-reactor:
        patterns:
          - windows-reactor
          - windows-reactor-setup
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /draftpad/src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - no-release
    commit-message:
      prefix: draftpad
    # draftpad's own webview2-com and windows have to be the ones Tauri's wry
    # uses, so they move only when Tauri does, by hand.
    ignore:
      - dependency-name: webview2-com
      - dependency-name: windows
    groups:
      # Tauri checks that its crates and its npm packages share a major and
      # minor version. A minor update raises one side at a time and cannot
      # pass on its own, so these are kept apart from the updates that can,
      # and brought in line by hand together with the npm side's tauri group.
      tauri:
        patterns:
          - tauri
          - tauri-*
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /draftpad
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - no-release
    commit-message:
      prefix: draftpad
    groups:
      # See the tauri group of /draftpad/src-tauri.
      tauri:
        patterns:
          - "@tauri-apps/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # TenabukuKit has no dependencies today. The entry is here so that one added
  # later is watched from the start.
  - package-ecosystem: swift
    directory: /tenabuku-app/Packages/TenabukuKit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - no-release
    commit-message:
      prefix: tenabuku-app
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - no-release
    groups:
      actions:
        patterns:
          - "*"
