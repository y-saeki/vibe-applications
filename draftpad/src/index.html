<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>draftpad</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="titlebar" data-tauri-drag-region></div>
    <main id="editor"></main>
    <footer id="statusbar">
      <div class="statusbar-group">
        <span id="status-chars" class="statusbar-cell">0 文字</span>
        <span id="status-lines" class="statusbar-cell">1 行</span>
      </div>
      <div class="statusbar-group statusbar-actions">
        <select id="language-select" aria-label="言語"></select>
        <button type="button" id="always-on-top" class="icon-button" aria-pressed="false" aria-label="常に手前に表示" title="常に手前に表示">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M5.25 1.5a.75.75 0 0 0 0 1.5h.45l-.5 3.35-1.65 1.65A.75.75 0 0 0 4.08 9.25H7.25v4.25a.75.75 0 0 0 1.5 0V9.25h3.17a.75.75 0 0 0 .53-1.28l-1.65-1.65-.5-3.32h.45a.75.75 0 0 0 0-1.5h-5.5Z" />
          </svg>
        </button>
        <button type="button" id="open-preferences" class="icon-button" aria-label="環境設定" title="環境設定">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path fill="currentColor" fill-rule="evenodd" d="M15.07 6.63A7.2 7.2 0 0 1 15.07 9.37L13.35 9.28A5.5 5.5 0 0 1 12.69 10.87L13.97 12.03A7.2 7.2 0 0 1 12.03 13.97L10.87 12.69A5.5 5.5 0 0 1 9.28 13.35L9.37 15.07A7.2 7.2 0 0 1 6.63 15.07L6.72 13.35A5.5 5.5 0 0 1 5.13 12.69L3.97 13.97A7.2 7.2 0 0 1 2.03 12.03L3.31 10.87A5.5 5.5 0 0 1 2.65 9.28L0.93 9.37A7.2 7.2 0 0 1 0.93 6.63L2.65 6.72A5.5 5.5 0 0 1 3.31 5.13L2.03 3.97A7.2 7.2 0 0 1 3.97 2.03L5.13 3.31A5.5 5.5 0 0 1 6.72 2.65L6.63 0.93A7.2 7.2 0 0 1 9.37 0.93L9.28 2.65A5.5 5.5 0 0 1 10.87 3.31L12.03 2.03A7.2 7.2 0 0 1 13.97 3.97L12.69 5.13A5.5 5.5 0 0 1 13.35 6.72L15.07 6.63ZM10.5 8A2.5 2.5 0 1 0 5.5 8A2.5 2.5 0 1 0 10.5 8Z" />
          </svg>
        </button>
      </div>
    </footer>

    <dialog id="preferences" aria-labelledby="preferences-title">
      <div class="panel">
        <div class="panel-header">
          <h1 id="preferences-title">環境設定</h1>
          <button type="button" id="preferences-close" class="icon-button" aria-label="閉じる"></button>
        </div>
        <!-- Two groups, not nine rows in a column: which of them a control
             belongs to is what tells the reader where to look. The order here
             is the tab order. -->
        <fieldset class="pref-group">
          <legend>編集</legend>
          <div class="form-row">
            <label for="pref-mode">モード</label>
            <select id="pref-mode">
              <option value="normal">Normal</option>
              <option value="vim">Vim</option>
            </select>
          </div>
          <div class="form-row">
            <label for="pref-tab-size">タブ幅</label>
            <input id="pref-tab-size" type="number" min="1" max="10" step="1" />
          </div>
          <div class="form-row">
            <label for="pref-quick-suggestions">入力候補を表示</label>
            <input id="pref-quick-suggestions" type="checkbox" />
          </div>
        </fieldset>
        <fieldset class="pref-group">
          <legend>表示</legend>
          <div class="form-row">
            <label for="pref-theme">テーマ</label>
            <select id="pref-theme">
              <option value="system">システムに合わせる</option>
              <option value="light">ライト</option>
              <option value="dark">ダーク</option>
            </select>
          </div>
          <div class="form-row">
            <label for="pref-font-family">フォント</label>
            <input id="pref-font-family" type="text" list="font-list" autocomplete="off" spellcheck="false" />
            <datalist id="font-list"></datalist>
          </div>
          <div class="form-row">
            <label for="pref-font-weight">フォントの太さ</label>
            <select id="pref-font-weight">
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="300">300</option>
              <option value="400">400</option>
              <option value="500">500</option>
              <option value="600">600</option>
              <option value="700">700</option>
              <option value="800">800</option>
              <option value="900">900</option>
            </select>
          </div>
          <div class="form-row">
            <label for="pref-font-size">フォントサイズ</label>
            <span class="form-control-with-unit">
              <input id="pref-font-size" type="number" min="10" max="100" step="1" />
              <span>px</span>
            </span>
          </div>
          <div class="form-row">
            <label for="pref-show-whitespace">空白文字を表示</label>
            <input id="pref-show-whitespace" type="checkbox" />
          </div>
          <div class="form-row">
            <label for="pref-show-indent-guides">インデントガイドを表示</label>
            <input id="pref-show-indent-guides" type="checkbox" />
          </div>
        </fieldset>
        <div class="panel-footer" id="pref-version"></div>
      </div>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
