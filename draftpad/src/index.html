<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>draftpad</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- The window's title bar. On macOS the system's buttons sit over its
         left end; on Windows the window has no frame of its own, so the three
         at the right end are ours. The whole strip drags the window, apart
         from its buttons. -->
    <header id="titlebar" data-tauri-drag-region="deep">
      <div class="titlebar-tools">
        <button type="button" id="always-on-top" class="icon-button" aria-pressed="false" aria-label="常に手前に表示" title="常に手前に表示">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <g transform="translate(0 1) rotate(45 10 10)">
              <path d="M6.875 3.125H13.125" />
              <path d="M8.25 3.125 7.75 8 5.5 10.75H14.5L12.25 8 11.75 3.125" />
              <path d="M10 10.75V17" />
            </g>
          </svg>
        </button>
        <button type="button" id="open-preferences" class="icon-button" aria-label="環境設定" title="環境設定">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M3 6.5H5M9 6.5H17M3 10.5H11M15 10.5H17M3 14.5H6M10 14.5H17" />
            <circle cx="7" cy="6.5" r="2" />
            <circle cx="13" cy="10.5" r="2" />
            <circle cx="8" cy="14.5" r="2" />
          </svg>
        </button>
      </div>
      <div class="window-controls">
        <button type="button" id="window-minimize" class="caption-button" tabindex="-1" aria-label="最小化" title="最小化">
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" d="M0 5.5H10" />
          </svg>
        </button>
        <button type="button" id="window-maximize" class="caption-button" tabindex="-1" aria-label="最大化" title="最大化">
          <svg class="glyph-maximize" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false">
            <rect fill="none" stroke="currentColor" x="0.5" y="0.5" width="9" height="9" />
          </svg>
          <svg class="glyph-restore" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" d="M2.5 2.5V0.5H9.5V7.5H7.5M0.5 2.5H7.5V9.5H0.5Z" />
          </svg>
        </button>
        <button type="button" id="window-close" class="caption-button" tabindex="-1" aria-label="閉じる" title="閉じる">
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" d="M0.5 0.5 9.5 9.5M9.5 0.5 0.5 9.5" />
          </svg>
        </button>
      </div>
    </header>
    <main id="editor">
      <!-- One head per pane: its bar. The right pane's head is hidden until
           that pane is opened. -->
      <div class="pane-row" id="pane-heads">
        <div class="pane-head" id="pane-head-a">
          <div class="pane-bar">
            <select id="language-select" aria-label="言語"></select>
            <div class="pane-bar-group">
              <span id="status-chars" class="pane-cell"><span class="count-figure">0</span> 文字</span>
              <span id="status-lines" class="pane-cell"><span class="count-figure">1</span> 行</span>
              <button type="button" id="open-compare" class="icon-button" aria-label="テキストを比較" title="テキストを比較">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                  <path fill="currentColor" fill-rule="evenodd" d="M4.6 1h6.8a3.6 3.6 0 0 1 3.6 3.6v6.8a3.6 3.6 0 0 1-3.6 3.6H4.6A3.6 3.6 0 0 1 1 11.4V4.6A3.6 3.6 0 0 1 4.6 1zM7.65 3.75L8.35 3.75A0.35 0.35 0 0 1 8.7 4.1L8.7 5.1A0.35 0.35 0 0 0 9.05 5.45L10.25 5.45A0.35 0.35 0 0 1 10.6 5.8L10.6 6.5A0.35 0.35 0 0 1 10.25 6.85L9.05 6.85A0.35 0.35 0 0 0 8.7 7.2L8.7 8.2A0.35 0.35 0 0 1 8.35 8.55L7.65 8.55A0.35 0.35 0 0 1 7.3 8.2L7.3 7.2A0.35 0.35 0 0 0 6.95 6.85L5.75 6.85A0.35 0.35 0 0 1 5.4 6.5L5.4 5.8A0.35 0.35 0 0 1 5.75 5.45L6.95 5.45A0.35 0.35 0 0 0 7.3 5.1L7.3 4.1A0.35 0.35 0 0 1 7.65 3.75zM5.75 10.6L10.25 10.6A0.35 0.35 0 0 1 10.6 10.95L10.6 11.65A0.35 0.35 0 0 1 10.25 12L5.75 12A0.35 0.35 0 0 1 5.4 11.65L5.4 10.95A0.35 0.35 0 0 1 5.75 10.6z" />
                </svg>
              </button>
              <button type="button" id="close-a" class="icon-button" aria-label="左ペインを閉じる" title="左ペインを閉じる" hidden>
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                  <path fill="currentColor" fill-rule="evenodd" d="M4.6 1h6.8a3.6 3.6 0 0 1 3.6 3.6v6.8a3.6 3.6 0 0 1-3.6 3.6H4.6A3.6 3.6 0 0 1 1 11.4V4.6A3.6 3.6 0 0 1 4.6 1zM10.758 4.747L11.253 5.242A0.35 0.35 0 0 1 11.253 5.737L9.237 7.753A0.35 0.35 0 0 0 9.237 8.247L11.253 10.263A0.35 0.35 0 0 1 11.253 10.758L10.758 11.253A0.35 0.35 0 0 1 10.263 11.253L8.247 9.237A0.35 0.35 0 0 0 7.753 9.237L5.737 11.253A0.35 0.35 0 0 1 5.242 11.253L4.747 10.758A0.35 0.35 0 0 1 4.747 10.263L6.763 8.247A0.35 0.35 0 0 0 6.763 7.753L4.747 5.737A0.35 0.35 0 0 1 4.747 5.242L5.242 4.747A0.35 0.35 0 0 1 5.737 4.747L7.753 6.763A0.35 0.35 0 0 0 8.247 6.763L10.263 4.747A0.35 0.35 0 0 1 10.758 4.747z" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="pane-head" id="pane-head-b" hidden>
          <div class="pane-bar">
            <select id="diff-mode-select" aria-label="差異の単位">
              <option value="line">行単位</option>
              <option value="char">文字単位</option>
            </select>
            <div class="pane-bar-group">
              <span id="status-diff" class="diff-stat"><span class="diff-added">+0</span><span class="diff-removed">−0</span></span>
              <span id="status-chars-b" class="pane-cell"><span class="count-figure">0</span> 文字</span>
              <span id="status-lines-b" class="pane-cell"><span class="count-figure">1</span> 行</span>
              <button type="button" id="close-b" class="icon-button" aria-label="右ペインを閉じる" title="右ペインを閉じる">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                  <path fill="currentColor" fill-rule="evenodd" d="M4.6 1h6.8a3.6 3.6 0 0 1 3.6 3.6v6.8a3.6 3.6 0 0 1-3.6 3.6H4.6A3.6 3.6 0 0 1 1 11.4V4.6A3.6 3.6 0 0 1 4.6 1zM10.758 4.747L11.253 5.242A0.35 0.35 0 0 1 11.253 5.737L9.237 7.753A0.35 0.35 0 0 0 9.237 8.247L11.253 10.263A0.35 0.35 0 0 1 11.253 10.758L10.758 11.253A0.35 0.35 0 0 1 10.263 11.253L8.247 9.237A0.35 0.35 0 0 0 7.753 9.237L5.737 11.253A0.35 0.35 0 0 1 5.242 11.253L4.747 10.758A0.35 0.35 0 0 1 4.747 10.263L6.763 8.247A0.35 0.35 0 0 0 6.763 7.753L4.747 5.737A0.35 0.35 0 0 1 4.747 5.242L5.242 4.747A0.35 0.35 0 0 1 5.737 4.747L7.753 6.763A0.35 0.35 0 0 0 8.247 6.763L10.263 4.747A0.35 0.35 0 0 1 10.758 4.747z" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- The pane, or the two panes, which src/editor.ts builds here, each
           with its own panel for search and replace. -->
      <div id="panes"></div>
    </main>

    <dialog id="preferences" aria-labelledby="preferences-title">
      <div class="panel">
        <div class="panel-header">
          <h1 id="preferences-title">環境設定</h1>
          <button type="button" id="preferences-close" class="icon-button" aria-label="閉じる"></button>
        </div>
        <!-- Two groups, not ten rows in a column: which of them a control
             belongs to is what tells the reader where to look. The order here
             is the tab order. -->
        <fieldset class="pref-group">
          <legend>編集</legend>
          <div class="form-row">
            <label for="pref-indent-style">インデント</label>
            <select id="pref-indent-style">
              <option value="spaces">スペース</option>
              <option value="tabs">タブ</option>
            </select>
          </div>
          <div class="form-row">
            <label for="pref-tab-size">インデント幅</label>
            <input id="pref-tab-size" type="number" min="1" max="10" step="1" />
          </div>
        </fieldset>
        <fieldset class="pref-group">
          <legend>表示</legend>
          <div class="form-row">
            <label for="pref-theme">テーマ</label>
            <select id="pref-theme">
              <option value="system">システムに合わせる</option>
              <option value="light">ライト</option>
              <option value="dark">ダーク</option>
            </select>
          </div>
          <div class="form-row">
            <label for="pref-font-family">フォント</label>
            <input id="pref-font-family" type="text" list="font-list" autocomplete="off" spellcheck="false" />
            <datalist id="font-list"></datalist>
          </div>
          <div class="form-row">
            <label for="pref-font-weight">フォントの太さ</label>
            <select id="pref-font-weight">
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="300">300</option>
              <option value="400">400</option>
              <option value="500">500</option>
              <option value="600">600</option>
              <option value="700">700</option>
              <option value="800">800</option>
              <option value="900">900</option>
            </select>
          </div>
          <div class="form-row">
            <label for="pref-font-size">フォントサイズ</label>
            <span class="form-control-with-unit">
              <input id="pref-font-size" type="number" min="10" max="100" step="1" />
              <span>px</span>
            </span>
          </div>
          <div class="form-row">
            <label for="pref-show-whitespace">空白文字を表示</label>
            <input id="pref-show-whitespace" type="checkbox" />
          </div>
          <div class="form-row">
            <label for="pref-show-indent-guides">インデントガイドを表示</label>
            <input id="pref-show-indent-guides" type="checkbox" />
          </div>
          <div class="form-row">
            <label for="pref-show-line-numbers">行番号を表示</label>
            <input id="pref-show-line-numbers" type="checkbox" />
          </div>
        </fieldset>
        <div class="panel-footer" id="pref-version"></div>
      </div>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
