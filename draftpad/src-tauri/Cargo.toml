[package]
name = "draftpad"
version = "0.1.0"
description = "A draft-only text editor for chat messages"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
name = "draftpad_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System font enumeration for the Preferences panel. Only the platforms we
# ship on; on other targets `list_fonts` returns an empty list.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
font-kit = "0.14"

# The taskbar jump list (`src/jumplist.rs`) is built with the Shell COM API, and
# the task it adds relaunches the executable, so a second launch has to be
# routed back into the running instance.
[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
