[package]
name = "draftpad"
version = "0.1.0"
description = "A draft-only text editor for chat messages"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
name = "draftpad_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System font enumeration for the Preferences panel. Only the platforms we
# ship on; on other targets `list_fonts` returns an empty list.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
font-kit = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
