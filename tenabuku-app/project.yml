# XcodeGen spec (https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md).
# Tenabuku.xcodeproj is generated from this file and is not committed:
# run `xcodegen generate` in this directory whenever this file changes (the
# git hooks in scripts/ do it after every pull). The sources are synced
# folders, so a Swift file added or removed needs nothing.
name: Tenabuku

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
  # Synced folders: Xcode lists what is in Tenabuku/ itself.
  projectFormat: xcode16_0
  defaultSourceDirectoryType: syncedFolder

# Base.xcconfig holds the defaults and optionally includes Secrets.xcconfig,
# which carries the Hatena consumer key and the signing team and stays local.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: 0.9.19
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"

packages:
  TenabukuKit:
    path: Packages/TenabukuKit

targets:
  Tenabuku:
    type: application
    platform: iOS
    sources:
      - Tenabuku
    info:
      path: Tenabuku/Info.plist
      properties:
        CFBundleDisplayName: てなブク
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        HatenaConsumerKey: $(HATENA_CONSUMER_KEY)
        HatenaConsumerSecret: $(HATENA_CONSUMER_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TENABUKU_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TenabukuKit
        products:
          - HatenaShared
          - HatenaOfficial
          - HatenaFeed
          - HatenaUnofficial
          - ReadingHistory
          - EntryMute
          - HomeShelves
          - PageImage
    scheme: {}
