[package]
name = "winwin"
version = "0.20.2"
edition = "2024"
publish = false
description = "A keyboard-driven window placer for Windows and macOS"

[features]
# The bindings the macOS app (macos/) calls the library through.
ffi = ["dep:uniffi"]
# The tool that writes the Swift side of those bindings.
ffi-bindgen = ["ffi", "uniffi/cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
uniffi = { version = "0.32", optional = true }

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["ffi-bindgen"]

[build-dependencies]
windows-reactor-setup = "0.100"

[target.'cfg(windows)'.dependencies]
windows-reactor = "0.100"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
