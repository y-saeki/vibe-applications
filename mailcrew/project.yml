# XcodeGen spec (https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md)
# for the native macOS app. MailCrew.xcodeproj is generated from this file and
# is not committed: run `xcodegen generate` once, and again whenever this file
# changes (DEVELOPMENT.md). The sources are synced folders, so a Swift file
# added or removed needs nothing, and the scheme builds the Rust library
# before every build.
name: MailCrew

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: ja
  # Synced folders: Xcode lists what is in MailCrew/ and MailCrewTests/ itself.
  projectFormat: xcode16_0
  defaultSourceDirectoryType: syncedFolder

settings:
  base:
    # The version of Mail Crew. A release is made when this goes up on main
    # (DEVELOPMENT.md); CFBundleVersion follows it.
    MARKETING_VERSION: 0.8.0
    SWIFT_VERSION: "5.0"
    # The Rust library is built for Apple silicon only (core/swift/build.sh).
    ARCHS: arm64
    # Not signed with a certificate: ad hoc, as the Tauri app's bundle was.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual

packages:
  MailCrewCore:
    path: core/swift

targets:
  MailCrew:
    type: application
    platform: macOS
    sources:
      - MailCrew
    info:
      path: MailCrew/Info.plist
      properties:
        CFBundleDisplayName: Mail Crew
        CFBundleName: Mail Crew
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(MARKETING_VERSION)
        # MailCrew/AppIcon.icns, drawn from icon.svg.
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    settings:
      base:
        # The Tauri app's identifier: the Keychain item and the settings folder
        # (~/Library/Application Support/com.ysaeki.mailcrew) carried over.
        PRODUCT_BUNDLE_IDENTIFIER: com.ysaeki.mailcrew
        PRODUCT_NAME: Mail Crew
        PRODUCT_MODULE_NAME: MailCrewMac
        # Where build.sh leaves libmailcrew_core.a, which the package's
        # module map links.
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/core/target/aarch64-apple-darwin/release
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MailCrewCore
        product: MailCrewCore
    # A pre-action cannot fail the build, so it leaves its log behind when the
    # Rust build failed, and this phase reports it as the build's error.
    preBuildScripts:
      - name: Check the Rust build
        basedOnDependencyAnalysis: false
        script: |
          failed="$SRCROOT/core/target/xcode-build.failed"
          if [ -f "$failed" ]; then
            echo "error: core/swift/build.sh failed; its output follows"
            sed 's/^/    /' "$failed"
            exit 1
          fi
    scheme:
      testTargets:
        - MailCrewTests
      # Before anything is built: the package compiles the bindings that
      # build.sh writes, so they have to be in place first. Quick when the
      # Rust side has not changed, since cargo and build.sh skip what is fresh.
      preActions:
        - name: Build the Rust library
          settingsTarget: MailCrew
          script: |
            cd "$SRCROOT"
            mkdir -p core/target
            failed=core/target/xcode-build.failed
            if core/swift/build.sh > "$failed.log" 2>&1; then
              rm -f "$failed" "$failed.log"
            else
              mv "$failed.log" "$failed"
            fi

  MailCrewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MailCrewTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/core/target/aarch64-apple-darwin/release
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mail Crew.app/Contents/MacOS/Mail Crew
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: MailCrew
