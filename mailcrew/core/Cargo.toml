[package]
name = "mailcrew-core"
# Never released on its own: what ships is the app, whose version is
# MARKETING_VERSION in ../project.yml.
version = "0.0.0"
description = "What Mail Crew does, without its screens: Gmail, sign-in, message bodies, BIMI"
edition = "2021"
publish = false

[lib]
name = "mailcrew_core"
crate-type = ["rlib"]

[features]
# The bindings the macOS app calls the library through (src/ffi.rs), which
# run the work on a multi-threaded Tokio runtime of their own.
ffi = ["dep:uniffi", "tokio/rt-multi-thread"]
# The tool that writes the Swift side of those bindings.
ffi-bindgen = ["ffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["ffi-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Gmail API and Google's token endpoint, over the OS TLS stack (Security.framework
# on macOS, SChannel on Windows) rather than a bundled one.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "form", "query", "system-proxy"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
futures = "0.3"
# The refresh token lives in the macOS Keychain / Windows Credential Manager.
keyring = "4"
# Message bodies: HTML sanitising, charset decoding, base64url.
ammonia = "4"
encoding_rs = "0.8"
# Guessing the charset of a body that names none, or names one it is not in.
chardetng = "1"
base64 = "0.23"
# PKCE for the sign-in.
sha2 = "0.11"
rand = "0.10"
url = "2"
# BIMI: the sender's DMARC and BIMI records in DNS, and the mark certificate
# they point to, checked against the BIMI roots.
hickory-resolver = "0.26"
psl = "2"
rustls-webpki = { version = "0.103", features = ["ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
x509-parser = "0.18"
flate2 = "1"
uniffi = { version = "0.32", optional = true }

[dev-dependencies]
# Mark certificates made up for the tests of the BIMI checks.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
