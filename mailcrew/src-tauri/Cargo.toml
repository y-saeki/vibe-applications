[package]
name = "mailcrew"
version = "0.7.0"
description = "A card-based Gmail inbox"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
name = "mailcrew_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens the sign-in page and the links in a message in the default browser.
# Only the Rust side calls it; the webview is granted none of its commands.
tauri-plugin-opener = "2"
# Everything but the screens: Gmail, sign-in, message bodies, BIMI. The native
# macOS app uses the same crate.
mailcrew-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
