[package]
name = "pecha-player"
version = "0.1.0"
description = "A slide player for rehearsing PechaKucha talks"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
name = "pecha_player_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Downloading a Google Slides deck as PDF (`src/google.rs`). Redirects are
# followed by hand so that every hop is checked against the allowed hosts.
ureq = "3"

# The simple fullscreen with the menu bar and the Dock hidden, and the web
# view kept as first responder (`src/fullscreen.rs`). Tauri already depends on
# these.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
