[package]
name = "myaku"
version = "0.2.0"
edition = "2024"
publish = false
description = "A tiny per-process resource monitor for the macOS menu bar and the Windows notification area"

[features]
# The bindings the macOS app (macos/) calls the library through.
ffi = ["dep:uniffi"]
# The tool that writes the Swift side of those bindings.
ffi-bindgen = ["ffi", "uniffi/cli"]

[dependencies]
uniffi = { version = "0.32", optional = true }

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["ffi-bindgen"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation_Numerics",
  "Wdk_System_SystemInformation",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
